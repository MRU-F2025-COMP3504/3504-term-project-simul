# Defines the services and volumes required for the application.
services:
  db:
    image: postgres:16
    container_name: simul-db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - simul_pgdata:/var/lib/postgresql/data

  # Unless your host machine is Linux with cgroup v2 or it is enforced in WSL:
  # Add the .wslconfig to %UserProfile%\ for piston
  # Then run wsl.exe --shutdown and relaunch wsl
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: simul-piston-api
    restart: always
    privileged: true
    ports:
      - "${PISTON_PORT}:2000"
    volumes:
      - ./data/piston/packages:/piston/packages
    tmpfs:
      - /tmp:exec

  # Check available runtimes to install:
  # http://localhost:2000/api/v2/packages
  #
  # How docs say to install  runtimes:
  #
  # docker exec -it simul-piston-api bash
  # piston ppman install node or piston ppman install node=20.11.1
  # piston ppman list
  # exit
  #
  # How I did it with curl
  # curl -X POST 'http://localhost:2000/api/v2/packages' -H 'Content-Type: application/json' -d '{\"language\":\"node\",\"version\":\"20.11.1\"}'
  #
  # if no curl then:
  # Invoke-RestMethod -Uri "http://localhost:2000/api/v2/packages" -Method POST -ContentType "application/json" -Body '{"language":"node","version":"20.11.1"}'
  #
  # Check installed runtimes:
  # http://localhost:2000/api/v2/runtimes
  #
  # Alternatively make a script for this
  #
  # Check code exec works at http://localhost:3000/dashboard/instructor (2 sum question)
  #
  # function twoSum(nums, target) {
  #   const seen = {};
  #   for (let i = 0; i < nums.length; i++) {
  #     const complement = target - nums[i];
  #     if (seen.hasOwnProperty(complement)) {
  #       return [seen[complement], i];
  #     }
  #     seen[nums[i]] = i;
  #   }
  #   return [];
  # }

volumes:
  simul_pgdata:
