# Defines the services and volumes required for the application.
services:
  db:
    image: postgres:16
    container_name: simul-db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - simul_pgdata:/var/lib/postgresql/data

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: simul-piston-api
    restart: always
    privileged: true
    ports:
      - "${PISTON_PORT}:${PISTON_PORT}"
    volumes:
      - ./data/piston/packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  simul_pgdata:
